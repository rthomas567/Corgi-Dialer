# Installs the dialer app into Twenty (corgi-smb.twenty.com) every time
# changes to twenty-app/ are pushed to main. Runs on GitHub's Linux servers,
# which avoids the Windows "Resource path must not contain backslashes" bug
# in Twenty's install tool.
#
# One-time setup: add a repository secret named TWENTY_API_KEY
# (GitHub repo > Settings > Secrets and variables > Actions).
#
# You can also run it by hand: GitHub repo > Actions > Deploy dialer to Twenty > Run workflow.

name: Deploy dialer to Twenty

on:
  push:
    branches: [main]
    paths:
      - 'twenty-app/**'
      - '.github/workflows/deploy-twenty-app.yml'
  workflow_dispatch:
    inputs:
      remove_deleted:
        description: 'Also remove pieces deleted from the code (for example a removed button)'
        type: boolean
        default: false

concurrency:
  group: deploy-twenty-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: twenty-app
    env:
      TWENTY_URL: https://corgi-smb.twenty.com
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Turn on Yarn
        run: corepack enable

      - name: Install the app's parts
        run: yarn install

      - name: Safety checks (types and tests must pass before anything is installed)
        run: |
          yarn typecheck
          yarn test:unit

      - name: Check the API key secret exists
        env:
          TWENTY_API_KEY: ${{ secrets.TWENTY_API_KEY }}
        run: |
          if [ -z "$TWENTY_API_KEY" ]; then
            echo "::error::Missing TWENTY_API_KEY secret. Add it in GitHub > Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Connect to Twenty
        env:
          TWENTY_API_KEY: ${{ secrets.TWENTY_API_KEY }}
        run: yarn twenty remote:add --url "$TWENTY_URL" --api-key "$TWENTY_API_KEY"

      - name: Install into Twenty
        #
        # The very last thing "apply" does, after the app is fully installed,
        # is generate optional helper code. Twenty Cloud blocks that step for
        # API keys ("GraphQL introspection has been disabled"). This app doesn't
        # use that helper code, so that one failure is treated as success.
        # Any other failure still fails the run.
        shell: bash
        run: |
          # Automatic runs never delete anything from Twenty (--no-delete).
          # A manual run with "remove_deleted" ticked removes pieces that were
          # deleted from the code (--force skips the typed confirmation).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.remove_deleted }}" = "true" ]; then
            APPLY_FLAGS="--force"
          else
            APPLY_FLAGS="--no-delete"
          fi
          echo "Running: yarn twenty apply $APPLY_FLAGS"
          set +e
          yarn twenty apply $APPLY_FLAGS 2>&1 | tee apply.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -q "Syncing manifest" apply.log && grep -q "Failed to generate API client" apply.log; then
            echo "::notice::Dialer installed in Twenty. Skipped the optional helper-code step that Twenty Cloud blocks for API keys."
            exit 0
          fi
          exit "$status"
